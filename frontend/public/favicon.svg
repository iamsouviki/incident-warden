<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="24" y1="14" x2="40" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <path d="M32 4L10 12V28C10 44 20 56 32 60C44 56 54 44 54 28V12L32 4Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#ringGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Inner Protective Shield Core -->
  <path d="M32 9L14 16V28C14 41 22 51 32 55C42 51 50 41 50 28V16L32 9Z" 
        fill="#0b1329" 
        fill-opacity="0.85" />

  <!-- Dynamic Automation Lightning Bolt -->
  <path d="M35 15L23 31H33L29 49L43 31H32L35 15Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" />
        
  <!-- Subtle Guard Dot -->
  <circle cx="32" cy="11.5" r="1.5" fill="#38bdf8" />
</svg>
