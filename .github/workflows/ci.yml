name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — mvn test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # No Postgres service is needed: the single @SpringBootTest
      # (ApplicationContextSmokeTest) overrides the datasource to in-memory H2 and
      # disables Liquibase, precisely so `mvn test` runs with no database. That also
      # means CI proves the context wires, not that the migrations are valid — schema
      # correctness is only proved by running against real Postgres + pgvector.
      - run: mvn -B test

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend
