name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a deployable jar can be produced from any branch on demand, without a push.
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — mvn test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # No Postgres service is needed: the single @SpringBootTest
      # (ApplicationContextSmokeTest) overrides the datasource to in-memory H2 and
      # disables Liquibase, precisely so `mvn test` runs with no database. That also
      # means CI proves the context wires, not that the migrations are valid — schema
      # correctness is only proved by running against real Postgres + pgvector.
      - run: mvn -B test

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend

  # What `mvn test` deliberately cannot prove. The unit suite runs on H2 with Liquibase off, so
  # nothing there reads the migrations at all — a changeset with a typo, a missing
  # CREATE EXTENSION vector, or a column the entities no longer match all stay green. This job
  # runs the real image against the real pgvector image and waits for the app's own healthcheck,
  # which only answers after Liquibase has finished. It is the only place the schema is checked.
  migrations:
    name: Migrations — pgvector and container startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres, Redis and the application
        env:
          # Throwaway, generated per run: this is a disposable container that is torn down below.
          MCP_JWT_SECRET: ci-only-jwt-signing-key-not-used-by-any-deployment-32
        run: docker compose up --build --wait --wait-timeout 420 postgres redis mcp-app
      - name: Confirm Liquibase applied every changeset
        run: |
          docker compose exec -T postgres psql -U warden_user -d incident_warden_db \
            -c "select count(*) as applied from databasechangelog;" \
            -c "select extname from pg_extension where extname = 'vector';"
      # Without this a failed startup is an opaque timeout. The app masks its own logs
      # (logback-spring.xml), so this is safe to print in a public run log.
      - name: Application log on failure
        if: failure()
        run: docker compose logs --no-color mcp-app
      - if: always()
        run: docker compose down -v

  # One artifact, one jar: the SPA is served from inside it, so this is the whole deployable.
  # Runs after the two check jobs so a red build never publishes something that looks shippable.
  package:
    name: Package — deployable jar
    needs: [backend, frontend, migrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # The SPA must exist before `package`: pom.xml copies frontend/dist into the jar's static/
      # at prepare-package, and maven-resources-plugin only warns about a missing directory. So
      # the order matters — get it wrong and the build stays green while the jar serves no UI,
      # which is why the existence of index.html is asserted rather than assumed.
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: test -f frontend/dist/index.html
      - run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: incident-warden-jar
          # Spring Boot's pre-repackage copy is target/*.jar.original, which this does not match.
          path: target/*.jar
          if-no-files-found: error
