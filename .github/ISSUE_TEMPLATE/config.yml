blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/iamsouviki/incident-warden/security/advisories/new
    about: >
      Report anything exploitable privately — approval bypass, credential disclosure, a script
      dispatched without a human. Please do not open a public issue for these.
  - name: Question or setup help
    url: https://github.com/iamsouviki/incident-warden/discussions
    about: >
      Getting it running, or asking how something is meant to work. Check the README's Quick
      start and the demo run sheet in docs/ first.
