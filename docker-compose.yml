version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mcp_postgres
    environment:
      POSTGRES_DB: mcp_db
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d mcp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mcp_redis
    command: redis-server --requirepass changeme
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    profiles: ["full"]
    image: quay.io/keycloak/keycloak:24.0
    container_name: mcp_keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/mcp_db
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: mcp_user
      KC_DB_PASSWORD: changeme
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy

  vault:
    profiles: ["full"]
    image: hashicorp/vault:1.16
    container_name: mcp_vault
    cap_add:
      - IPC_LOCK
    command: server
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data

  mcp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mcp_db
      SPRING_DATASOURCE_USERNAME: mcp_user
      SPRING_DATASOURCE_PASSWORD: changeme
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: changeme
      KEYCLOAK_URL: http://keycloak:8080
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-token
      VAULT_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: docker
      # ── LLM API credentials (secrets only — provider/model config lives in application.yml) ──
      # Populate only the key matching the provider set in application.yml → mcp.llm.provider
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}           # needed when provider=openai
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}     # needed when provider=anthropic
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}  # needed when provider=gemini
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}  # needed when provider=gemini
      # Ollama (default) — set base URL only if running Ollama outside this compose network
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # ── ITSM alert sources ──
      MCP_SERVICENOW_ENABLED: ${MCP_SERVICENOW_ENABLED:-false}
      SERVICENOW_INSTANCE_URL: ${SERVICENOW_INSTANCE_URL:-}
      SERVICENOW_USERNAME: ${SERVICENOW_USERNAME:-}
      SERVICENOW_PASSWORD: ${SERVICENOW_PASSWORD:-}
      MCP_FRESHSERVICE_ENABLED: ${MCP_FRESHSERVICE_ENABLED:-false}
      FRESHSERVICE_DOMAIN: ${FRESHSERVICE_DOMAIN:-}
      FRESHSERVICE_API_KEY: ${FRESHSERVICE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcp_frontend
    ports:
      - "3000:80"
    depends_on:
      mcp-app:
        condition: service_healthy

  jaeger:
    profiles: ["full"]
    image: jaegertracing/all-in-one:latest
    container_name: mcp_jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC

  elasticsearch:
    profiles: ["full"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: mcp_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    profiles: ["full"]
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: mcp_kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    profiles: ["full"]
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: mcp_logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch

volumes:
  postgres_data:
  redis_data:
  vault_data:
  elasticsearch_data:

networks:
  default:
    name: mcp-network
