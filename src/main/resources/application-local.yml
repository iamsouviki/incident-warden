spring:
  datasource:
    url: jdbc:h2:file:./.data/mcp-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
    show-sql: false
  liquibase:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: simple
  cloud:
    vault:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  ai:
    ollama:
      chat:
        enabled: false
      embedding:
        enabled: false
    vectorstore:
      pgvector:
        initialize-schema: false

mcp:
  poc:
    role-selection-enabled: true
  security:
    cors:
      allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
  llm:
    provider: custom
    custom:
      api-url: http://localhost:9090/v1
      api-key: mock-key
      chat-model: manus-1.6
      embed-model: mock-embed
  autonomy:
    enabled: true
    execution-mode: SIMULATED
    poll-interval-ms: 5000
    batch-size: 10
    allow-p1: false
  telemetry:
    auto-create-incidents: true
  confidence:
    auto-resolve-threshold: 0.85
    hitl-threshold: 0.70

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework: WARN
    com.company.mcp: INFO
    org.hibernate.SQL: WARN
