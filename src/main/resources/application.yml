spring:
  application:
    name: mcp-incident-automation

  # ── Multipart file upload limits (SOP document import: PDF, DOCX, TXT) ──────
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 52MB
      file-size-threshold: 2MB

  datasource:
    url: jdbc:postgresql://localhost:5432/mcp_db
    driver-class-name: org.postgresql.Driver
    username: mcp_user
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

  autoconfigure:
    exclude:
      # ── Disable non-Ollama AI providers by default (no API key needed) ──
      # Remove a class from this list to re-enable that provider.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
      - org.springframework.ai.model.vertexai.autoconfigure.gemini.VertexAiGeminiChatAutoConfiguration
      - org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiMultiModalEmbeddingAutoConfiguration



  ai:
    # ════════════════════════════════════════════════════════════════
    # Spring AI provider blocks.
    # DEFAULT: Ollama with phi3:mini (local, no API key needed).
    # All LLM features (SOP extraction, script generation, RAG) use
    # the same ChatClient and work with ANY provider below.
    # To switch provider, comment out the autoconfigure.exclude entries
    # above for that provider and set the required env vars.
    # ════════════════════════════════════════════════════════════════

    # ── Ollama (default — local, no API key needed) ─────────────
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}    # ← your Ollama server
      chat:
        enabled: ${SPRING_AI_OLLAMA_CHAT_ENABLED:true}       # ← set true when Ollama is running
        options:
          model: ${OLLAMA_CHAT_MODEL:phi3:mini}                   # ← phi3:mini | qwen2.5:latest | llama3.2
          temperature: 0.0
      embedding:
        enabled: ${SPRING_AI_OLLAMA_EMBED_ENABLED:true}      # ← set true when Ollama is running
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}      # ← nomic-embed-text | mxbai-embed-large

    # ── OpenAI ──────────────────────────────────────────────────
    openai:
      api-key: ${OPENAI_API_KEY:}          # ← set env var or paste key here
      chat:
        enabled: ${SPRING_AI_OPENAI_CHAT_ENABLED:false}      # ← auto-enabled when OPENAI_API_KEY is set
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o}                 # ← gpt-4o | gpt-4-turbo | gpt-3.5-turbo
          temperature: 0.0
      embedding:
        enabled: ${SPRING_AI_OPENAI_EMBED_ENABLED:false}     # ← auto-enabled when OPENAI_API_KEY is set
        options:
          model: ${OPENAI_EMBED_MODEL:text-embedding-3-small} # ← text-embedding-3-small | text-embedding-3-large

    # ── Anthropic / Claude ──────────────────────────────────────
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}       # ← set env var or paste key here
      chat:
        enabled: ${SPRING_AI_ANTHROPIC_ENABLED:false}      # ← set true + ANTHROPIC_API_KEY
        options:
          model: ${ANTHROPIC_CHAT_MODEL:claude-3-5-sonnet-20241022}  # claude-3-5-sonnet | claude-3-opus | claude-3-haiku
          temperature: 0.0

    # ── Google Gemini (Vertex AI) ────────────────────────────────────
    # Credentials: GOOGLE_APPLICATION_CREDENTIALS=/path/to/service-account.json
    vertex:
      ai:
        gemini:
          enabled: ${SPRING_AI_GEMINI_ENABLED:false}         # ← set true + GOOGLE_APPLICATION_CREDENTIALS
          project-id: ${GCP_PROJECT_ID:my-gcp-project}      # ← your GCP project ID
          location: ${GCP_REGION:us-central1}               # ← Vertex AI region
          chat:
            options:
              model: ${GEMINI_CHAT_MODEL:gemini-1.5-pro}    # gemini-1.5-pro | gemini-1.5-flash | gemini-2.0-flash
              temperature: 0.0

    # ── pgvector VectorStore — RAG / semantic search ───────────────────
    # Uses the existing datasource (same PostgreSQL instance).
    # Requires pgvector extension:  CREATE EXTENSION IF NOT EXISTS vector;
    # Spring AI auto-creates the 'vector_store' table when initialize-schema=true.
    vectorstore:
      pgvector:
        initialize-schema: true           # ← auto-creates vector_store table on startup
        index-type: HNSW                  # ← HNSW | IVFFLAT (HNSW is faster for query)
        distance-type: COSINE_DISTANCE    # ← COSINE_DISTANCE | EUCLIDEAN_DISTANCE | NEGATIVE_INNER_PRODUCT
        dimensions: 1536                  # ← must match embedding model: 1536 for text-embedding-3-small
                                          #   768 for nomic-embed-text (Ollama)

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/mcp
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/mcp/protocol/openid-connect/certs

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  web:
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      max-age: 3600

spring.cloud.vault:
  enabled: ${VAULT_ENABLED:false}
  uri: ${VAULT_ADDR:http://localhost:8200}
  token: ${VAULT_TOKEN}
  kv.enabled: true
  kv.backend: secret

# MCP Application Specific Configuration
mcp:
  # ════════════════════════════════════════════════════════════
  #  ENTERPRISE LLM CUSTOMIZATION — edit this block to wire in
  #  your organisation's LLM.  This is the ONLY place you need
  #  to change.  No code changes, no environment variables.
  #
  #  provider   : ollama | openai | anthropic | gemini
  #  api-url    : base URL of the provider API
  #  api-key    : secret key (leave blank for Ollama)
  #  chat-model : model used for incident classification / SOP generation
  #  embed-model: model used for pgvector RAG embeddings
  # ════════════════════════════════════════════════════════════
  llm:
    # ════════════════════════════════════════════════════════════════
    #  ENTERPRISE LLM CUSTOMIZATION — change only this one field to
    #  switch provider.  All provider-specific settings live in the
    #  spring.ai.* blocks above (filled in once per deployment).
    #
    #  provider: ollama | openai | anthropic | gemini | custom
    #
    #  ollama    → spring.ai.ollama.*       (local, no key needed)
    #  openai    → spring.ai.openai.*       (set OPENAI_API_KEY)
    #  anthropic → spring.ai.anthropic.*    (set ANTHROPIC_API_KEY)
    #  gemini    → spring.ai.vertex.ai.*    (set GOOGLE_APPLICATION_CREDENTIALS)
    #  custom    → mcp.llm.custom.*         (any OpenAI-compatible endpoint)
    # ════════════════════════════════════════════════════════════════
    provider: ollama

    # ── Custom / other provider ──────────────────────────────────
    # Only read when provider=custom.  Works with any OpenAI-compatible
    # endpoint: LM Studio, vLLM, Azure OpenAI, LocalAI, Groq, Together AI…
    # Leave these commented out when using one of the 4 known providers.
    custom:
      api-url:     ""     # ← e.g. http://my-vllm-server:8000/v1
      api-key:     ""     # ← secret key (set any non-empty string if no auth needed)
      chat-model:  ""     # ← model name accepted by the endpoint
      embed-model: ""     # ← embedding model name (optional; leave blank to skip embeddings)

  scheduler:
    polling-interval-ms: 60000
    processing-interval-ms: 10000
    batch-size: 5
    stale-job-timeout-minutes: 10
    max-retries: 3
    hitl-timeout:
      p1-minutes: 15
      p2-minutes: 30
  
  guardrails:
    enabled: true
    blast-radius-threshold: 0.40
    max-blast-radius-pct: 40
    rate-limit:
      tool-calls-per-minute: 10
      restarts-per-30min: 5
      auto-resolutions-per-hour: 20
    loop-detection:
      max-attempts: 3
      window-seconds: 1200
  
  confidence:
    auto-resolve-threshold: 1.00
    hitl-threshold: 0.80
    enable-p1-auto-resolve: false
  
  tools:
    health-check-interval-seconds: 60
    timeout-ms: 30000
    timeout-seconds: 30
    url-check-timeout-ms: 5000
    dry-run: false
    default-definitions:
      enabled: false

  # ── Spring AI RAG configuration ────────────────────────────────────────────
  rag:
    enabled: true                        # ← set false to disable VectorStore entirely
    top-k: 5                             # ← max similar documents returned per query
    similarity-threshold: 0.60           # ← minimum cosine similarity score (0.0–1.0)

  # ─── JWT Configuration ──────────────────────────────────────────────────────
  jwt:
    secret: mcp-incident-automation-jwt-secret-key-32c
    expiry-ms: 86400000   # 24 hours

  # ─── HashiCorp Vault (credential store for remote servers) ───────────────
  # VaultCredentialService reads credentials from this Vault instance.
  # Set MCP_VAULT_TOKEN env-var in production; dev falls back to env-vars.
  vault:
    enabled: false               # set true when Vault is available
    url: http://localhost:8200
    token: ${MCP_VAULT_TOKEN:dev-root-token}
    # KV v2 mount path — credentials stored at <mount>/<servers-prefix>/<hostname>
    mount: secret
    servers-prefix: mcp/servers  # e.g. secret/data/mcp/servers/app-server-01
    # Fallback env-var credentials used when vault.enabled=false
    fallback-ssh-user: ${MCP_SSH_USER:mcpagent}
    fallback-ssh-password: ${MCP_SSH_PASSWORD:}
    fallback-ssh-key-path: ${MCP_SSH_KEY_PATH:}   # path to PEM file on local disk

  # ─── ServiceNow Integration (ITSM alert source) ───────────────────────────
  # When enabled, IncidentPollingScheduler polls ServiceNow every 60s for new incidents.
  # Requires: instance-url, username, password.
  servicenow:
    enabled: ${MCP_SERVICENOW_ENABLED:false}
    instance-url: ${SERVICENOW_INSTANCE_URL:https://your-instance.service-now.com}
    username: ${SERVICENOW_USERNAME:admin}
    password: ${SERVICENOW_PASSWORD:changeme}
    table: incident
    query-filter: ""                        # extra sysparm_query (e.g. "assignment_group=IT Ops")
    limit: 50                               # max tickets per poll cycle

  # ─── FreshService Integration (ITSM alert source) ────────────────────────
  # When enabled, IncidentPollingScheduler polls FreshService every 60s for new tickets.
  # Requires: domain, api-key.
  freshservice:
    enabled: ${MCP_FRESHSERVICE_ENABLED:false}
    domain: ${FRESHSERVICE_DOMAIN:your-company}          # → https://your-company.freshservice.com
    api-key: ${FRESHSERVICE_API_KEY:changeme}
    ticket-type: Incident
    limit: 50                               # max tickets per poll cycle

  # ─── Remote Execution (SSH) ──────────────────────────────────────────────
  # RemoteExecutionService uses these defaults; per-host overrides come from Vault.
  remote:
    ssh-connect-timeout-ms: 15000
    ssh-channel-timeout-ms: 60000
    # NONE | ASK | YES  (YES accepts all host keys — fine for internal networks)
    strict-host-checking: NONE
    # Temp script path on remote host (a UUID suffix is appended at runtime)
    linux-script-dir: /tmp
    windows-script-dir: C:\Windows\Temp
    # Whether to delete the uploaded script after execution
    cleanup-script: true

  # ─── LLM Script Generator ────────────────────────────────────────────────
  script-gen:
    # Ollama-compatible endpoint (OpenAI-compatible API)
    api-url: http://localhost:11434/v1/chat/completions
    # No API key needed for Ollama — set a dummy value so the service doesn't fall back to templates
    api-key: ${OPENAI_API_KEY:ollama}
    model: qwen2.5:latest
    max-tokens: 768
    temperature: 0.1
    api-timeout-ms: 0
    # Max script lines — go beyond this and the script is BLOCKED
    max-lines: 100
    # Max distinct commands — go beyond this and a WARN is raised
    max-distinct-commands: 15
    # When true, WARN-level guardrail findings also block execution (forces HITL)
    warn-requires-hitl: false
    # Permanently banned patterns — matched case-insensitively anywhere in the script
    blocklist: "rm -rf /,format c:,mkfs.,dd if=/dev/,dd if=,:(){:|:&};:,> /dev/sda,> /dev/hda"

  # ─── SOP Parser LLM controls + cache ─────────────────────────────────────
  sop-parser:
    llm:
      chunk-size: 100000      # chars per chunk — full doc sent if smaller (qwen2.5 handles ~100K chars)
      chunk-overlap: 2000     # overlap between consecutive chunks
      max-output-tokens: 2048 # cap LLM response size
      num-ctx: 32768          # Ollama context window in tokens
    cache:
      enabled: true
      ttl-minutes: 180          # reuse parsed result for repeated uploads
      max-entries: 500

# Resilience4J Circuit Breakers
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      servicenow:
        base-config: default
      freshservice:
        base-config: default

  ratelimiter:
    configs:
      default:
        registerHealthIndicator: false
        limitRefreshPeriod: 1m
        limitForPeriod: 100
    instances:
      global:
        base-config: default

# Actuator & Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

# Logging
logging:
  level:
    root: INFO
    com.company.mcp: INFO
    org.springframework: WARN
    org.springframework.ai: DEBUG
    org.springframework.boot.actuate: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/mcp-incident-automation.log

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  tomcat:
    connection-timeout: -1          # no timeout — LLM calls can be very slow
    keep-alive-timeout: 600000      # 10 min keep-alive
    threads:
      max: 200

spring.mvc.async.request-timeout: -1  # no async timeout — LLM on low-spec device

