spring:
  application:
    name: incident-warden

  # ── Multipart file upload limits (SOP document import: PDF, DOCX, TXT) ──────
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 52MB
      file-size-threshold: 2MB

  datasource:
    url: jdbc:postgresql://localhost:5432/mcp_db
    driver-class-name: org.postgresql.Driver
    username: mcp_user
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: mcp_rag
    liquibase-schema: mcp_rag

  autoconfigure:
    exclude:
      # ── Disable non-Ollama AI providers by default (no API key needed) ──
      # Remove a class from this list to re-enable that provider.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
      - org.springframework.ai.model.vertexai.autoconfigure.gemini.VertexAiGeminiChatAutoConfiguration
      - org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiMultiModalEmbeddingAutoConfiguration



  ai:
    # ════════════════════════════════════════════════════════════════
    # Spring AI provider blocks.
    # DEFAULT: Ollama with phi3:mini (local, no API key needed).
    # All LLM features (SOP extraction, script generation, RAG) use
    # the same ChatClient and work with ANY provider below.
    # To switch provider, comment out the autoconfigure.exclude entries
    # above for that provider and set the required env vars.
    # ════════════════════════════════════════════════════════════════

    # ── Ollama (default — local, no API key needed) ─────────────
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}    # ← your Ollama server
      chat:
        enabled: ${SPRING_AI_OLLAMA_CHAT_ENABLED:true}       # ← set true when Ollama is running
        options:
          model: ${OLLAMA_CHAT_MODEL:phi3:mini}                   # ← phi3:mini | qwen2.5:latest | llama3.2
          temperature: 0.0
      embedding:
        enabled: ${SPRING_AI_OLLAMA_EMBED_ENABLED:true}      # ← set true when Ollama is running
        model: nomic-embed-text
        options:
          model: nomic-embed-text

    # ── OpenAI ──────────────────────────────────────────────────
    openai:
      api-key: ${OPENAI_API_KEY:}          # ← set env var or paste key here
      chat:
        enabled: ${SPRING_AI_OPENAI_CHAT_ENABLED:false}      # ← auto-enabled when OPENAI_API_KEY is set
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o}                 # ← gpt-4o | gpt-4-turbo | gpt-3.5-turbo
          temperature: 0.0
      embedding:
        enabled: ${SPRING_AI_OPENAI_EMBED_ENABLED:false}     # ← auto-enabled when OPENAI_API_KEY is set
        options:
          model: ${OPENAI_EMBED_MODEL:text-embedding-3-small} # ← text-embedding-3-small | text-embedding-3-large

    # ── Anthropic / Claude ──────────────────────────────────────
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}       # ← set env var or paste key here
      chat:
        enabled: ${SPRING_AI_ANTHROPIC_ENABLED:false}      # ← set true + ANTHROPIC_API_KEY
        options:
          model: ${ANTHROPIC_CHAT_MODEL:claude-3-5-sonnet-20241022}  # claude-3-5-sonnet | claude-3-opus | claude-3-haiku
          temperature: 0.0

    # ── Google Gemini (Vertex AI) ────────────────────────────────────
    # Credentials: GOOGLE_APPLICATION_CREDENTIALS=/path/to/service-account.json
    vertex:
      ai:
        gemini:
          enabled: ${SPRING_AI_GEMINI_ENABLED:false}         # ← set true + GOOGLE_APPLICATION_CREDENTIALS
          project-id: ${GCP_PROJECT_ID:my-gcp-project}      # ← your GCP project ID
          location: ${GCP_REGION:us-central1}               # ← Vertex AI region
          chat:
            options:
              model: ${GEMINI_CHAT_MODEL:gemini-1.5-pro}    # gemini-1.5-pro | gemini-1.5-flash | gemini-2.0-flash
              temperature: 0.0

    # ── pgvector VectorStore — RAG / semantic search ───────────────────
    # Uses the existing datasource (same PostgreSQL instance).
    # Requires pgvector extension:  CREATE EXTENSION IF NOT EXISTS vector;
    # Spring AI auto-creates the 'vector_store' table when initialize-schema=true.
    vectorstore:
      pgvector:
        schema-name: sop
        initialize-schema: false          # ← schema now managed by Liquibase
        index-type: HNSW                  # ← HNSW | IVFFLAT (HNSW is faster for query)
        distance-type: COSINE_DISTANCE    # ← COSINE_DISTANCE | EUCLIDEAN_DISTANCE | NEGATIVE_INNER_PRODUCT
        dimensions: 768                   # ← must match embedding model: 1536 for text-embedding-3-small
                                          #   768 for nomic-embed-text (Ollama)

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# MCP Application Specific Configuration
mcp:
  hitl:
    # When true the analyst who requested a plan cannot approve their own plan.
    # Only disable for a single-operator demo.
    separation-of-duties: ${MCP_HITL_SEPARATION_OF_DUTIES:true}
    # When true, an incident with no APPROVED procedure can still reach a reviewer with a
    # script written from model knowledge alone. The script must scan clean (PASS, not
    # WARN), it is labelled UNGROUNDED_LLM_SCRIPT, and a human still approves the exact
    # text. Set false to restore the strict posture: no approved SOP, no plan, escalate.
    allow-ungrounded-scripts: ${MCP_HITL_ALLOW_UNGROUNDED_SCRIPTS:true}
  
  confidence:
    # Read by AgentAssessmentService and AiConfigService. The score decides only how a plan
    # is presented — whether it may be offered for approval at all. Every run is approved
    # individually regardless of score, so there is no threshold above which one is not.
    hitl-threshold: 0.80
    # Assumed success rate for a remediation with no execution history yet.
    default-prior-success-rate: 0.85

  # The remediation executor agent. Approved scripts are POSTed to <url>/execute as
  # {"script","language","target"} rather than run in this process, so the control plane
  # holding the approvals is never itself a shell.
  #
  # Named mcp.executor, not mcp.autonomy. The old namespace also carried enabled,
  # poll-interval-ms, batch-size, allow-p1 and max-retries for a polling loop that could
  # remediate on its own. That loop is deleted, and a config key named "autonomy" on a
  # platform where every action is approved by a person is a question an auditor has to
  # ask twice.
  executor:
    # The only switch that decides whether a script really leaves this process.
    enabled: ${MCP_EXECUTOR_ENABLED:false}
    # Empty means approved scripts simulate and change nothing.
    url: ${MCP_EXECUTOR_URL:}
    token: ${MCP_EXECUTOR_TOKEN:}
    timeout-seconds: ${MCP_EXECUTOR_TIMEOUT_SECONDS:30}

  telemetry:
    auto-create-incidents: ${MCP_TELEMETRY_AUTO_CREATE_INCIDENTS:true}

  # ── Spring AI RAG configuration ────────────────────────────────────────────
  rag:
    enabled: true                        # ← set false to disable VectorStore entirely
    top-k: 5                             # ← max similar documents returned per query
    similarity-threshold: 0.60           # ← minimum cosine similarity score (0.0–1.0)

  # ─── JWT Configuration ──────────────────────────────────────────────────────
  # MCP_JWT_SECRET must be set at deploy time (≥ 32 bytes). The application
  # refuses to start if the variable is absent or too short — see JwtService.
  jwt:
    secret: ${MCP_JWT_SECRET}
    expiry-ms: 86400000   # 24 hours

  # ─── SSO / OIDC ──────────────────────────────────────────────────────────────
  # Set mcp.sso.enabled=true and configure all four keys to activate the /api/auth/sso
  # endpoint. With any key absent the endpoint returns 503 (fail-closed by design).
  sso:
    enabled: ${MCP_SSO_ENABLED:false}
    jwk-set-uri: ${MCP_SSO_JWK_SET_URI:}          # e.g. https://accounts.google.com/.well-known/jwks.json
    issuer: ${MCP_SSO_ISSUER:}                      # must match the "iss" claim in provider tokens
    audience: ${MCP_SSO_AUDIENCE:}                  # must match the "aud" claim (your client_id)
    allowed-email-domains: ${MCP_SSO_ALLOWED_DOMAINS:}  # comma-separated, empty = all domains permitted
    default-tenant-id: ${MCP_SSO_DEFAULT_TENANT:tenant-1}

  # ─── Rate limiting ───────────────────────────────────────────────────────────
  security:
    # Browser origins permitted to call the API. Never "*" — credentialed CORS
    # with a wildcard origin is rejected by browsers and leaks the API surface.
    cors:
      allowed-origins: ${MCP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
    rate-limit:
      login-per-minute: ${MCP_RATE_LIMIT_LOGIN:10}   # per username and per source IP
      llm-per-minute: ${MCP_RATE_LIMIT_LLM:20}       # per authenticated user

  # ─── ServiceNow Integration (ITSM alert source) ───────────────────────────
  # Read by IncidentService for on-demand import. There is no background poller: nothing
  # in this application is @Scheduled, so a ticket arrives by an explicit import call or
  # by POST /api/v1/intake. Add a poller only when someone asks for unattended intake.
  servicenow:
    enabled: ${MCP_SERVICENOW_ENABLED:false}
    instance-url: ${SERVICENOW_INSTANCE_URL:https://your-instance.service-now.com}
    username: ${SERVICENOW_USERNAME:admin}
    password: ${SERVICENOW_PASSWORD:changeme}
    table: incident
    query-filter: ""                        # extra sysparm_query (e.g. "assignment_group=IT Ops")
    limit: 50                               # max tickets per poll cycle

  # ─── FreshService Integration (ITSM alert source) ────────────────────────
  # On-demand import, same as ServiceNow above. No background poller.
  freshservice:
    enabled: ${MCP_FRESHSERVICE_ENABLED:false}
    domain: ${FRESHSERVICE_DOMAIN:your-company}          # → https://your-company.freshservice.com
    api-key: ${FRESHSERVICE_API_KEY:changeme}
    ticket-type: Incident
    limit: 50                               # max tickets per poll cycle

  # ─── Generated-script limits ─────────────────────────────────────────────
  script-gen:
    # A script longer than this is BLOCKED rather than truncated: a reviewer who has to
    # scroll past 100 lines is not really reviewing it. Read by RemediationScriptService.
    max-lines: 100

# Resilience4J Circuit Breakers
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      servicenow:
        base-config: default
      freshservice:
        base-config: default

  ratelimiter:
    configs:
      default:
        registerHealthIndicator: false
        limitRefreshPeriod: 1m
        limitForPeriod: 100
    instances:
      global:
        base-config: default

# Actuator & Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

# Logging
logging:
  level:
    root: INFO
    com.company.mcp: INFO
    org.springframework: WARN
    org.springframework.ai: DEBUG
    org.springframework.boot.actuate: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/incident-warden.log

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  tomcat:
    connection-timeout: -1          # no timeout — LLM calls can be very slow
    keep-alive-timeout: 600000      # 10 min keep-alive
    threads:
      max: 200

spring.mvc.async.request-timeout: -1  # no async timeout — LLM on low-spec device


